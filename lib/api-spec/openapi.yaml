openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DBI website inquiries and publishing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Public inquiry submissions and admin follow-up
  - name: news
    description: Published news and admin publishing
  - name: admin
    description: Protected administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a contact, quote, or partnership inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryCreated"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /news:
    get:
      operationId: listPublishedNews
      tags: [news]
      summary: List published news
      responses:
        "200":
          description: Published news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /admin/me:
    get:
      operationId: getAdminIdentity
      tags: [admin]
      summary: Check whether the signed-in user is an authorized DBI administrator
      responses:
        "200":
          description: Authenticated user and admin access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Read administration dashboard counts
      responses:
        "200":
          description: Overview counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/inquiries:
    get:
      operationId: listAdminInquiries
      tags: [admin, inquiries]
      summary: List inquiries for administrator follow-up
      responses:
        "200":
          description: Inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/inquiries/{id}:
    patch:
      operationId: updateAdminInquiry
      tags: [admin, inquiries]
      summary: Update an inquiry follow-up status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryStatusUpdate"
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Invalid inquiry or status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Inquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/news:
    get:
      operationId: listAdminNews
      tags: [admin, news]
      summary: List all news, including drafts
      responses:
        "200":
          description: All news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminNews
      tags: [admin, news]
      summary: Create a news article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "400":
          description: Invalid article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/news/{id}:
    patch:
      operationId: updateAdminNews
      tags: [admin, news]
      summary: Update a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpdate"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "400":
          description: Invalid article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminNews
      tags: [admin, news]
      summary: Delete a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Article deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    InquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: ["string", "null"]
          maxLength: 180
        country:
          type: ["string", "null"]
          maxLength: 120
        phone:
          type: ["string", "null"]
          maxLength: 80
        kind:
          type: string
          enum: [quote, partnership, supplier, financing, after_sales, other]
        message:
          type: string
          minLength: 10
          maxLength: 5000
        website:
          type: string
          maxLength: 200
          description: Honeypot field for automated submissions; must remain empty
      required: [name, email, kind, message]
    InquiryCreated:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [new]
      required: [id, status]
    Inquiry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        company:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        kind:
          type: string
          enum: [quote, partnership, supplier, financing, after_sales, other]
        message:
          type: string
        status:
          type: string
          enum: [new, in_progress, closed]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, kind, message, status, createdAt]
    InquiryStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, in_progress, closed]
      required: [status]
    NewsItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, published]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, title, slug, excerpt, content, category, status, createdAt, updatedAt]
    NewsInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 220
        slug:
          type: string
          minLength: 3
          maxLength: 220
        excerpt:
          type: string
          minLength: 10
          maxLength: 500
        content:
          type: string
          minLength: 10
          maxLength: 20000
        category:
          type: string
          minLength: 2
          maxLength: 120
        imageUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        status:
          type: string
          enum: [draft, published]
      required: [title, slug, excerpt, content, category, status]
    NewsUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 220
        slug:
          type: string
          minLength: 3
          maxLength: 220
        excerpt:
          type: string
          minLength: 10
          maxLength: 500
        content:
          type: string
          minLength: 10
          maxLength: 20000
        category:
          type: string
          minLength: 2
          maxLength: 120
        imageUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        status:
          type: string
          enum: [draft, published]
    AdminIdentity:
      type: object
      properties:
        email:
          type: string
        isAdmin:
          type: boolean
      required: [email, isAdmin]
    AdminOverview:
      type: object
      properties:
        totalInquiries:
          type: integer
        newInquiries:
          type: integer
        publishedArticles:
          type: integer
        draftArticles:
          type: integer
      required: [totalInquiries, newInquiries, publishedArticles, draftArticles]

